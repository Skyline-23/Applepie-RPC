name: 📦 macOS Release

on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
  
jobs:
  build-and-release:
    runs-on: macos-26
    env:
      # 앱 스킴(타겟 이름)
      APP_SCHEME: Applepie-RPC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Derive release metadata
        id: release_meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          IS_PRERELEASE=false
          if [ "$VERSION" != "$BASE_VERSION" ]; then
            IS_PRERELEASE=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Import signing certificate & provisioning profile
        id: import-certs
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_PASSWORD }}
          create-keychain: true
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain: signing_temp

      - name: Find Developer ID Application identity
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/signing_temp.keychain-db"
          echo "🔑 Using keychain: $KEYCHAIN_PATH"
          
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed -e 's/"//g')

          echo "----- ALL IDENTITIES IN KEYCHAIN -----"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "--------------------------------------"
    
          DEV_IDENTITY=$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk -F\" '/Developer ID Application:/ {print $2; exit}'
          )
          echo "Found Developer ID cert: $DEV_IDENTITY"
          echo "CODE_SIGN_IDENTITY=$DEV_IDENTITY" >> $GITHUB_ENV

      - name: Fail if no code signing identity
        run: |
          if [ -z "${CODE_SIGN_IDENTITY}" ]; then
            echo "❌ CODE_SIGN_IDENTITY is not set. Aborting."
            exit 1
          fi

      - name: Create App Store Connect API Key file
        run: |
          echo "${{ secrets.APPSTORE_PRIVATE_KEY_P8 }}" | base64 --decode \
            > "${GITHUB_WORKSPACE}/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8"
          chmod 600 "${GITHUB_WORKSPACE}/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8"

      - name: Install create-dmg CLI
        run: npm install --global create-dmg

      - name: Build & Archive .app
        run: |
          echo "🔍 CODE_SIGN_IDENTITY is: [$CODE_SIGN_IDENTITY]"
          xcodebuild archive \
            -scheme "${{ env.APP_SCHEME }}" \
            -skipPackagePluginValidation \
            -configuration Release \
            -archivePath "${{ github.workspace }}/build/${{ env.APP_SCHEME }}.xcarchive" \
            -derivedDataPath "${{ github.workspace }}/build" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="Q23JLSJCCV" \
            MARKETING_VERSION="$BASE_VERSION" \
            CURRENT_PROJECT_VERSION="$BASE_VERSION" \
            SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            SENTRY_ENVIRONMENT="production" \
            SWIFT_UPCOMING_FEATURES="AsyncExecutionBehaviorAttributes NonescapableTypes" \
            OTHER_SWIFT_FLAGS="-no-verify-emitted-module-interface"

      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Upload dSYMs to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "ℹ️ Sentry env not set; skipping dSYM upload."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          sentry-cli releases new "$VERSION" || true
          sentry-cli releases set-commits --auto "$VERSION" || true
          sentry-cli upload-dif \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            "${{ github.workspace }}/build/${{ env.APP_SCHEME }}.xcarchive/dSYMs"
          sentry-cli releases finalize "$VERSION"

      - name: Extract .app from archive
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp -R "$GITHUB_WORKSPACE/build/$APP_SCHEME.xcarchive/Products/Applications/$APP_SCHEME.app" \
                "$GITHUB_WORKSPACE/dist/"

      - name: Deep code sign .app
        run: |
          APP="${{ github.workspace }}/dist/${{ env.APP_SCHEME }}.app"
          ENTITLEMENTS="${{ github.workspace }}/Applepie-RPC/Resources/Applepie_RPC.entitlements"
          codesign --force --deep --options runtime --timestamp \
                   --entitlements "$ENTITLEMENTS" \
                   --sign "${CODE_SIGN_IDENTITY}" \
                   "$APP"

      - name: Create DMG
        run: |
          APP_PATH="${{ github.workspace }}/dist/${{ env.APP_SCHEME }}.app"
          DIST_DIR="${{ github.workspace }}/dist"
          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Contents/Info.plist")
          echo "🔖 App version: $VERSION"

          create-dmg \
            "$APP_PATH" \
            "$DIST_DIR" \
            --overwrite \
            --dmg-title="${{ env.APP_SCHEME }}-${{ github.ref_name }}"

          GENERATED=$(ls "$DIST_DIR" | grep "${{ env.APP_SCHEME }} ${VERSION}.dmg" || true)
          if [ -z "$GENERATED" ]; then
            exit 1
          fi
          TARGET_NAME="${{ env.APP_SCHEME }}-${{ github.ref_name }}.dmg"
          mv "$DIST_DIR/$GENERATED" "$DIST_DIR/$TARGET_NAME"
          echo "✅ Renamed $GENERATED → $TARGET_NAME"

      - name: Notarize & Staple DMG
        uses: GuillaumeFalourd/notary-tools@v1
        with:
          # 만들어진 DMG 경로
          product_path: "${{ github.workspace }}/dist/${{ env.APP_SCHEME }}-${{ github.ref_name }}.dmg"
          # Repository secrets에 등록한 값
          apple_id: ${{ secrets.APPLE_ID }}
          password: ${{ secrets.APPLE_PASSWORD }}
          team_id: ${{ secrets.TEAM_ID }}
          staple: true
          xcode_path: '/Applications/Xcode.app'

      - name: Download Sparkle tools
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sparkle"
          curl -L \
            -o "$GITHUB_WORKSPACE/sparkle/Sparkle-2.8.1.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz
          tar -xf "$GITHUB_WORKSPACE/sparkle/Sparkle-2.8.1.tar.xz" -C "$GITHUB_WORKSPACE/sparkle"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          DIST_DIR="${{ github.workspace }}/dist"
          APPCAST_DIR="${DIST_DIR}/appcast"
          APPCAST_URL_PREFIX="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"

          if [ -z "$SPARKLE_ED25519_PRIVATE_KEY" ]; then
            echo "❌ SPARKLE_ED25519_PRIVATE_KEY is not set. Aborting."
            exit 1
          fi

          mkdir -p "$APPCAST_DIR"
          cp -f "$DIST_DIR/${{ env.APP_SCHEME }}-${{ github.ref_name }}.dmg" "$APPCAST_DIR/"

          echo "$SPARKLE_ED25519_PRIVATE_KEY" | \
            "$GITHUB_WORKSPACE/sparkle/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "$APPCAST_URL_PREFIX" \
              "$APPCAST_DIR"

          mv "$APPCAST_DIR/appcast.xml" "$DIST_DIR/appcast.xml"

      - name: Publish beta appcast feed
        if: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
        env:
          FEED_BRANCH: update-feed
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FEED_DIR="${RUNNER_TEMP}/update-feed"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf "$FEED_DIR"
          if git clone --depth 1 --branch "$FEED_BRANCH" "$REMOTE_URL" "$FEED_DIR"; then
            echo "ℹ️ Reusing existing ${FEED_BRANCH} branch."
          else
            git init "$FEED_DIR"
            cd "$FEED_DIR"
            git checkout --orphan "$FEED_BRANCH"
            git remote add origin "$REMOTE_URL"
          fi

          cd "$FEED_DIR"
          mkdir -p beta
          cp "${GITHUB_WORKSPACE}/dist/appcast.xml" "beta/appcast.xml"

          git add beta/appcast.xml
          if git diff --cached --quiet; then
            echo "ℹ️ Beta feed is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "feed: publish beta appcast for ${GITHUB_REF_NAME}" \
            -m "- Update beta/appcast.xml with the latest prerelease Sparkle feed"
          git push origin HEAD:"${FEED_BRANCH}"

      - name: Generate release notes
        run: |
          bash "${{ github.workspace }}/scripts/generate_release_notes.sh" "${{ github.ref_name }}" \
            > "${{ github.workspace }}/release_notes.md"

      - name: Create GitHub Release
        if: ${{ steps.release_meta.outputs.is_prerelease != 'true' }}
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ github.workspace }}/release_notes.md
          files: |
            ${{ github.workspace }}/dist/${{ env.APP_SCHEME }}-${{ github.ref_name }}.dmg
            ${{ github.workspace }}/dist/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Pre-release
        if: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
        id: create_prerelease
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ github.workspace }}/release_notes.md
          prerelease: true
          files: |
            ${{ github.workspace }}/dist/${{ env.APP_SCHEME }}-${{ github.ref_name }}.dmg
            ${{ github.workspace }}/dist/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap cask
        if: ${{ success() }}
        env:
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.release_meta.outputs.is_prerelease }}
          TAP_REPO: Skyline-23/homebrew-applepie-rpc
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          set -euo pipefail

          DMG_PATH="${GITHUB_WORKSPACE}/dist/${APP_SCHEME}-${TAG}.dmg"
          if [ ! -f "$DMG_PATH" ]; then
            echo "❌ DMG not found: $DMG_PATH"
            exit 1
          fi

          VERSION="${TAG#v}"
          DMG_SHA="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          echo "🔖 Tap cask version: $VERSION"
          echo "🔐 DMG sha256: $DMG_SHA"

          if [ "$IS_PRERELEASE" = "true" ]; then
            CASK_NAME="applepie-rpc-beta"
            LIVECHECK_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/update-feed/beta/appcast.xml"
            CASK_DESC="Beta macOS menu bar app that publishes now-playing info to Discord Rich Presence"
          else
            CASK_NAME="applepie-rpc"
            LIVECHECK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
            CASK_DESC="macOS menu bar app that publishes now-playing info to Discord Rich Presence"
          fi
          CASK_PATH="Casks/${CASK_NAME}.rb"

          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "❌ HOMEBREW_TAP_PAT is not set."
            echo "   Add a fine-grained token with Contents: Read/Write on ${TAP_REPO}."
            exit 1
          fi

          TAP_DIR="${RUNNER_TEMP}/homebrew-tap"
          rm -rf "$TAP_DIR"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$TAP_DIR"
          cd "$TAP_DIR"

          VERSION="$VERSION" DMG_SHA="$DMG_SHA" CASK_NAME="$CASK_NAME" CASK_PATH="$CASK_PATH" LIVECHECK_URL="$LIVECHECK_URL" CASK_DESC="$CASK_DESC" python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["CASK_PATH"])
          version = os.environ["VERSION"]
          sha = os.environ["DMG_SHA"]
          cask_name = os.environ["CASK_NAME"]
          livecheck_url = os.environ["LIVECHECK_URL"]
          desc = os.environ["CASK_DESC"]

          content = f'''cask "{cask_name}" do
            version "{version}"
            sha256 "{sha}"

            url "https://github.com/Skyline-23/Applepie-RPC/releases/download/v#{{version}}/Applepie-RPC-v#{{version}}.dmg",
                verified: "github.com/Skyline-23/Applepie-RPC/"
            name "Applepie-RPC"
            desc "{desc}"
            homepage "https://github.com/Skyline-23/Applepie-RPC"

            livecheck do
              url "{livecheck_url}"
              strategy :sparkle
            end

            app "Applepie-RPC.app"

            zap trash: [
              "~/Library/Application Support/Applepie-RPC",
              "~/Library/Preferences/com.skyline23.Applepie-RPC.plist",
            ]
          end
          '''

          path.write_text(content)
          PY

          git add "$CASK_PATH"
          if git diff --cached --quiet; then
            echo "ℹ️ No tap cask changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "cask: bump ${CASK_NAME} to v${VERSION}" \
            -m "- Update ${CASK_PATH} to match ${TAG}" \
            -m "- Source release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          git push origin main
